<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة طلبات ستايلك</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px}.box,.order{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}input,select,button{padding:11px;border:1px solid #ddd;border-radius:9px;font-size:15px}button{cursor:pointer}.top{display:flex;gap:8px;flex-wrap:wrap}.order h3{margin:0 0 8px}.muted{color:#777}.items{border-top:1px solid #eee;margin-top:10px;padding-top:10px}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.danger{color:#a00}.ok{color:#087a35}</style></head><body><div class="wrap"><h1>📦 طلبات ستايلك</h1><div class="box top"><input id="pass" type="password" placeholder="كلمة مرور الإدارة"><button onclick="load()">عرض الطلبات</button></div><div id="msg" class="muted"></div><div id="orders"></div></div><script>
let password=''; async function load(){password=document.getElementById('pass').value;const r=await fetch('/api/orders',{headers:{'x-admin-password':password}});const d=await r.json();if(!r.ok){msg.textContent=d.error||'خطأ';return}msg.textContent='عدد الطلبات: '+d.orders.length;orders.innerHTML=d.orders.map(o=>`<div class="order"><div class="row"><h3>${esc(o.id)}</h3><span>${new Date(o.createdAt).toLocaleString('ar-EG')}</span></div><p><b>${esc(o.customer.name)}</b> — ${esc(o.customer.phone)} — ${esc(o.customer.city)}</p><p>${esc(o.customer.address)}</p>${o.customer.notes?`<p class="muted">ملاحظات: ${esc(o.customer.notes)}</p>`:''}<div class="items">${o.items.map(i=>`<div>${esc(i.name)} — مقاس ${esc(i.size)} × ${i.qty} = ${i.price*i.qty} ج.م</div>`).join('')}<p>المنتجات: ${o.subtotal} ج.م | الشحن: ${o.shipping} ج.م | <b>الإجمالي: ${o.total} ج.م</b></p></div><div class="row"><select onchange="status('${o.id}',this.value)">${['جديد','تم التأكيد','قيد التجهيز','تم الشحن','تم التسليم','ملغي'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><b class="${o.status==='ملغي'?'danger':'ok'}">${esc(o.status)}</b></div></div>`).join('')}
async function status(id,s){await fetch('/api/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({status:s})});load()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
